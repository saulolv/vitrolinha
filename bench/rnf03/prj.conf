# Configuração comum da bancada do RNF03.
#
# O que importa aqui é que o caminho de código medido seja o MESMO que o
# firmware vai percorrer. Toda opção que muda o padrão de acesso ao disco está
# declarada, mesmo quando coincide com o padrão do Zephyr — porque a medição
# vale para esta configuração e não para outra.

# ----------------------------------------------------------------------------
# Cartão e sistema de arquivos
# ----------------------------------------------------------------------------
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# Os mesmos do firmware. NUM_FILES e NUM_DIRS são pré-alocados estaticamente,
# e a varredura da biblioteca precisa de um diretório e um arquivo abertos ao
# mesmo tempo.
CONFIG_FS_FATFS_NUM_FILES=2
CONFIG_FS_FATFS_NUM_DIRS=2

# Nomes longos DESLIGADOS, como no firmware. Não é detalhe: com LFN cada
# entrada de diretório ocupa várias entradas de 32 bytes, o diretório cresce em
# setores e a varredura que o `fs_open` faz fica mais cara. Medir com LFN
# ligado mediria outra coisa.
# CONFIG_FS_FATFS_LFN is not set

# ----------------------------------------------------------------------------
# Temporização
# ----------------------------------------------------------------------------

# O mesmo do firmware: 50 us de quantização.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=20000

# ----------------------------------------------------------------------------
# Relatório
# ----------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# A pilha de main carrega o buffer de 4 KB da faixa? Não — ele é estático. Mas
# o FatFs põe um setor de 512 B em cada FIL, e o mkfs usa um buffer de trabalho
# de mais 512 B na pilha de quem chama.
CONFIG_MAIN_STACK_SIZE=4096

# printk NAO passa pelo subsistema de log. O padrão é passar (LOG_PRINTK é
# `default y if PRINTK`), e em modo diferido isso põe o relatório inteiro na
# fila do log: a primeira versão desta bancada perdeu 128 mensagens por
# estouro de buffer, e a tabela saiu pela metade. Aqui printk escreve direto
# no console, e o relatório sai inteiro e na ordem.
CONFIG_LOG_PRINTK=n
