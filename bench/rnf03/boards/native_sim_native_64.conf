# A bancada no simulador.
#
# Aqui o disco é registrado pela própria aplicação (bench/rnf03/sim_card.c),
# e não por um nó de devicetree. Isso tem uma consequência não óbvia, tratada
# abaixo.

# ----------------------------------------------------------------------------
# O nome do volume
# ----------------------------------------------------------------------------

# O FatFs do Zephyr monta a lista de volumes a partir do DEVICETREE: o
# FF_VOLUME_STRS é gerado varrendo os nós com compatible `zephyr,sdmmc-disk`,
# `zephyr,ram-disk` e afins (zephyr/modules/fatfs/zephyr_fatfs_config.h). Um
# disco registrado só em código não aparece nessa lista, e o FatFs não teria
# como resolver o volume "SD:" — nem FF_VOLUMES teria valor válido.
#
# Estas duas opções são a saída oficial para esse caso: fornecem a lista de
# volumes por Kconfig em vez de por devicetree. O nome é o mesmo `disk-name`
# do nó `sdhc0` da ZBook, para que o ponto de montagem seja idêntico nos dois
# alvos.
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=1
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="SD"

# ----------------------------------------------------------------------------
# Formatação em tempo de execução
# ----------------------------------------------------------------------------

# O volume é formatado a cada execução, com a geometria de um cartão de
# verdade: FAT32, aglomerados de 32 KiB, duas FATs, tabela de partição. É essa
# geometria que determina quantos setores o FatFs lê — o firmware não precisa
# de mkfs e não o inclui.
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MKFS=y

# Sem CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT aqui, ao contrário do firmware: a
# bancada não tem shell, logo não há driver de UART, logo o console cai no do
# próprio arch POSIX, que já escreve na saída padrão. Declarar a opção só
# renderia um aviso de Kconfig sobre escolha sem seleção.
#
# O aviso "No SOURCES given to Zephyr library: drivers__disk" é esperado pelo
# mesmo motivo: DISK_ACCESS traz DISK_DRIVERS junto, e não há nenhum driver de
# disco compilado — o disco é registrado pela aplicação.

# ----------------------------------------------------------------------------
# Velocidade
# ----------------------------------------------------------------------------

# O padrão do native_sim é frear a execução até o tempo real (`default y if
# BT_USERCHAN || !TEST`). Numa bancada isso é só espera: o disco de mentira
# cobra centenas de milissegundos de tempo SIMULADO por medição, e frear faria
# a execução gastar isso de tempo de parede sem mudar nenhum número.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n
