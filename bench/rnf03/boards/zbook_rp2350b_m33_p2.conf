# A bancada na placa.
#
# Aqui não há disco de mentira nem modelo de custo: o cartão é o cartão, e o
# `k_cycle_get_64()` mede tempo de verdade. As colunas de setor do relatório
# saem vazias — não há como instrumentar o `disk_access` do driver do SD sem
# alterá-lo —, e é justamente para isso que existe o alvo simulado.
#
# O defconfig da ZBook já traz SDHC, DISK_ACCESS, DISK_DRIVERS, FILE_SYSTEM e
# FAT_FILESYSTEM_ELM.

# Os mesmos cortes do firmware: os padrões são 10000 ms vezes 3 tentativas, o
# que faria um único fs_read bloquear por dezenas de segundos com o cartão
# ausente. Medir com os padrões mediria uma configuração que não vai para a
# placa.
CONFIG_SD_DATA_TIMEOUT=500
CONFIG_SD_DATA_RETRIES=1

# Estouro de pilha vira exceção com a thread culpada, em vez de corrupção
# silenciosa.
CONFIG_HW_STACK_PROTECTION=y
