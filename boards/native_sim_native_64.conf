# Configuração específica do alvo de simulação.
#
# Reproduz o OLED e as entradas da ZBook no desktop, para que as trilhas de
# interface e de armazenamento não fiquem na fila da placa física. O comum
# aos dois alvos está em prj.conf.
#
# O que NÃO é reproduzido aqui: o áudio. Não existe PWM emulado no Zephyr, e
# ouvir a melodia continua exigindo hardware.

# ----------------------------------------------------------------------------
# A tela
# ----------------------------------------------------------------------------

# Mono de 1 bit, com o zero representando preto — a mesma convenção do
# SSD1306, em que o bit ligado acende o pixel. Com isso o LVGL usa o mesmo
# caminho de código monocromático dos dois lados, incluindo o buffer de
# conversão e o arredondamento de área para múltiplos de 8 em Y.
CONFIG_SDL_DISPLAY_DEFAULT_PIXEL_FORMAT_MONO01=y

# 128x64 numa tela de desktop é um selo. Quadruplicar mantém a proporção e
# a grade de pixels visível, que é o que se quer conferir numa interface
# desenhada para 1 bpp.
CONFIG_SDL_DISPLAY_ZOOM_PCT=400

# ----------------------------------------------------------------------------
# As entradas
# ----------------------------------------------------------------------------

# Teclado do host acionando os pinos de GPIO emulados declarados em
# boards/native_sim.overlay. Os drivers que ficam acima — gpio-keys e o
# subsistema input — são os mesmos da placa.
CONFIG_GPIO_EMUL_SDL=y

# ----------------------------------------------------------------------------
# O cartão
# ----------------------------------------------------------------------------

# Não há cartão aqui, e é de propósito: o módulo `card` roda igual nos dois
# alvos e conclui "ausente" quando nenhum disco de nome "SD" está registrado.
# O que precisa ser dito ao FatFs é só o nome do volume.
#
# O FatFs do Zephyr monta a lista de volumes a partir do DEVICETREE — o
# FF_VOLUME_STRS sai da varredura dos nós `zephyr,sdmmc-disk` e afins, em
# zephyr/modules/fatfs/zephyr_fatfs_config.h. No simulador não existe nó
# nenhum desses, e sem a lista o FF_VOLUMES ficaria sem valor válido e o
# módulo não compilaria. Estas duas opções são a saída oficial: a lista vem
# por Kconfig.
#
# O nome é o mesmo `disk-name` do nó `sdhc0` da ZBook, para que o ponto de
# montagem seja idêntico nos dois alvos — é dele que sai o CARD_MOUNT_POINT.
#
# Inserção e remoção de verdade são exercitadas em tests/card/, com um disco
# controlado pelo próprio teste.
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=1
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="SD"

# ----------------------------------------------------------------------------
# Console
# ----------------------------------------------------------------------------

# Sem isto o console vai para um pseudo-terminal e é preciso abrir um segundo
# terminal para vê-lo. Assim o relatório de bring-up e o shell saem no mesmo
# terminal que lançou o executável, ao lado da janela da tela.
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
