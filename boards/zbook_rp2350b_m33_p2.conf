# Configuração específica da ZBook P2.
#
# O defconfig da placa já traz GPIO, I2C, SPI, ADC, SERIAL, PINCTRL,
# CLOCK_CONTROL, LOG, FPU, LED_STRIP, SDHC, DISK_ACCESS, DISK_DRIVERS,
# FILE_SYSTEM e FAT_FILESYSTEM_ELM. Aqui fica o que falta e o que só existe
# nesta placa. O comum aos dois alvos está em prj.conf.

# ----------------------------------------------------------------------------
# Periféricos da placa
# ----------------------------------------------------------------------------
CONFIG_PWM=y
CONFIG_PWM_RPI_PICO=y

# O player espera comando e resultado de carga num mesmo `k_poll`. Sem a
# opção, src/CMakeLists.txt deixa player e loader fora da placa, e o clique
# na biblioteca não toca nada.
CONFIG_POLL=y

# Decodificador de quadratura do encoder PEC12R. No simulador não existe: as
# setas do teclado viram INPUT_REL_WHEEL em src/sim_encoder.c.
CONFIG_INPUT_GPIO_QDEC=y

# O painel é um SSD1306, não um SH1106. Descrito como SH1106 ele confirma no
# I²C e aceita tudo, mas a bomba de carga não liga e a tela fica preta.
CONFIG_SSD1306=y

# ----------------------------------------------------------------------------
# Cartão
# ----------------------------------------------------------------------------
#
# O sistema de arquivos em si é comum aos dois alvos e está em prj.conf. Aqui
# fica só o que existe quando há um cartão SD de verdade do outro lado.

# Os padrões são 10000 ms vezes 3 tentativas, o que faria um único fs_read
# bloquear por dezenas de segundos com o cartão removido. É este corte que
# limita também a espera do `fs_unmount` na remoção a quente: o
# `sdmmc_wait_ready` do caminho de desmontagem tem por teto justamente o
# SD_DATA_TIMEOUT.
CONFIG_SD_DATA_TIMEOUT=500
CONFIG_SD_DATA_RETRIES=1

# CONFIG_SD_INIT_TIMEOUT fica no padrão de 1500 ms, e não cortado como os de
# cima. É o prazo que a especificação física do SD dá ao cartão para concluir
# a inicialização (1 s para o ACMD41, mais folga); encurtá-lo trocaria uma
# espera rara por rejeitar cartões legítimos. O preço é que uma tentativa de
# montagem pode custar 1,5 s — e é por isso que ela mora numa thread de
# prioridade 12, e não na fila de trabalho do sistema.

# ----------------------------------------------------------------------------
# Robustez
# ----------------------------------------------------------------------------

# MPU do Cortex-M33 guardando o fim de cada pilha: estouro vira exceção com
# a thread culpada identificada, em vez de corrupção silenciosa de memória
# vizinha.
CONFIG_HW_STACK_PROTECTION=y

# ----------------------------------------------------------------------------
# Diagnóstico que depende da arquitetura
# ----------------------------------------------------------------------------

# Consumo de pilha por thread: critério de avaliação do trabalho (issue #13).
# Mora aqui e não em prj.conf porque o analisador depende de !ARCH_POSIX: no
# simulador ele não existe. O relatório vira tabela com
# scripts/stack_report.py; o método e as folgas estão em
# docs/medicoes/pilhas-por-thread.md.
CONFIG_THREAD_ANALYZER=y

# Relatório periódico, sem código na aplicação. O intervalo fica no padrão de
# 60 s: o analisador mede marca d'água, que só sobe, então o intervalo decide
# apenas quando o pico aparece no console, não se ele aparece. Para ler na
# hora, o shell tem `kernel thread stacks` e `kernel thread list`.
CONFIG_THREAD_ANALYZER_AUTO=y

# SILENCIOSO: a prioridade padrão da thread do analisador é 0, a maior
# preemptível — a mesma armadilha do workqueue do LVGL. Uma varredura de
# todas as pilhas, palavra por palavra, passaria na frente do `player`.
CONFIG_THREAD_ANALYZER_AUTO_THREAD_PRIORITY_OVERRIDE=y
CONFIG_THREAD_ANALYZER_AUTO_THREAD_PRIORITY=10

# Já é o padrão, declarado porque o projeto depende disso: com ele desligado a
# varredura percorre as threads com interrupções TRAVADAS, e o tick que
# dispara a próxima nota esperaria a leitura de todas as pilhas.
CONFIG_THREAD_ANALYZER_RUN_UNLOCKED=y

# Também o padrão, e também declarado: o callback do k_timer que dispara cada
# nota roda na pilha de interrupção, e ela é a única que nenhuma thread mede.
CONFIG_THREAD_ANALYZER_ISR_STACK_USAGE=y

# Com CONFIG_LOG_PRINTK, o printk do analisador passa pelo log diferido, e a
# thread do analisador (10) escreve o bloco inteiro antes de a de log (14)
# rodar: todas as linhas têm de caber no buffer ao mesmo tempo. Com o padrão
# de 1024 B, as ~13 linhas de hoje, de ~70-80 B cada, já encostam no teto —
# estimativa, não observação —, e cada thread nova acrescenta uma. O
# LOG_MODE_OVERFLOW descarta as MAIS ANTIGAS, isto é, o começo do relatório.
# 3 KB a mais de RAM estática, em 520 KB. Se ainda assim transbordar, o
# console mostra "messages dropped" e o scripts/stack_report.py avisa.
CONFIG_LOG_BUFFER_SIZE=4096
