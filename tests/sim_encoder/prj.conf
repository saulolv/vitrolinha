# Testes unitários rodam em native_sim, no host.
CONFIG_ZTEST=y
CONFIG_ASSERT=y

# src/sim_encoder.c depende do subsistema de entrada.
CONFIG_INPUT=y

# Despacho síncrono: o callback roda no contexto de quem publicou o evento,
# em vez de numa thread própria. Torna o caso determinístico — sem isso, cada
# verificação teria de esperar por uma thread e o teste passaria a depender de
# temporização.
CONFIG_INPUT_MODE_SYNCHRONOUS=y
