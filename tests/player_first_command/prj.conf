CONFIG_ZTEST=y
CONFIG_ASSERT=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=20000
# O player espera comando e resultado de carga num mesmo k_poll.
CONFIG_POLL=y
# O que se testa é o primeiro comando, não o fim da faixa. Explícito porque
# o padrão do projeto é ligado, e este teste não enxergava a opção antes de
# incluir o Kconfig.vitrolinha.
CONFIG_VITROLINHA_AUTO_ADVANCE=n
