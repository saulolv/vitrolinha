# Este teste é o único que precisa de uma pilha de disco: o módulo sob teste
# monta um volume de verdade, sobre o FatFs de verdade. O que troca é só o
# disco embaixo — um vetor em RAM em vez do cartão.
CONFIG_ZTEST=y
CONFIG_ASSERT=y

# ----------------------------------------------------------------------------
# A pilha que o módulo atravessa
# ----------------------------------------------------------------------------
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# O FatFs monta a lista de volumes a partir do devicetree, e aqui não há nó de
# disco nenhum — o disco é registrado em tempo de execução pelo próprio teste.
# Sem esta lista o FF_VOLUMES fica sem valor válido e o módulo não compila.
# É a mesma saída que boards/native_sim_native_64.conf usa, e o nome tem de
# ser o mesmo que o módulo deriva de CARD_MOUNT_POINT.
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=1
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="SD"

# O mesmo do firmware, e por dependência do que o teste comprova: com a
# formatação automática ligada, um volume ilegível seria FORMATADO por
# fs_mount e passaria a montar — o caso "presente e ilegivel" deixaria de
# existir, e o teste que o exige passaria a testar o oposto do firmware.
CONFIG_FS_FATFS_MOUNT_MKFS=n

# Formatar o disco de mentira uma vez, no preparo, é o que dá ao teste um
# cartão "bom" para trabalhar. O firmware não tem esta opção, de propósito:
# a biblioteca é do usuário.
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MKFS=y

# Os mesmos do firmware.
CONFIG_FS_FATFS_NUM_FILES=2
CONFIG_FS_FATFS_NUM_DIRS=2

# ----------------------------------------------------------------------------
# Pilhas
# ----------------------------------------------------------------------------

# O fs_mkfs do FatFs põe um buffer de trabalho de FF_MAX_SS (512 B) na pilha
# de quem chama, e quem chama aqui é o preparo da suíte.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096

# ----------------------------------------------------------------------------
# Diagnóstico
# ----------------------------------------------------------------------------

# O módulo registra as transições por LOG_INF; com o log mudo, uma falha de
# montagem não deixaria rastro nenhum na saída do teste.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_THREAD_NAME=y
