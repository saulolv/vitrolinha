# Testes unitários rodam em native_sim, no host. Nada de específico da placa
# entra aqui: os módulos sob teste não tocam em periférico.
CONFIG_ZTEST=y
CONFIG_ASSERT=y

# Mesma taxa de tique do firmware. O caso de concorrência publica de dentro
# de um callback de temporizador, e é a taxa que determina quantas vezes o
# leitor é de fato interrompido no meio da cópia.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=20000
