CONFIG_ZTEST=y
CONFIG_ASSERT=y
CONFIG_LOG=y
CONFIG_VITROLINHA_STORAGE_HOST=y

# O display de teste nasce sem inicializar — `zephyr,deferred-init` no
# app.overlay, sem opção de Kconfig —, para que o teste veja display_init()
# recusar um display que não está pronto antes de chamar device_init().
CONFIG_DISPLAY=y

# Sem janela nem SDL: o display é o de teste, e o toque SDL do native_sim
# dependeria da janela que ele desligou.
CONFIG_SDL_DISPLAY=n
CONFIG_INPUT=y
CONFIG_INPUT_SDL_TOUCH=n

# Cada input_report_key() chega ao keypad do LVGL antes de voltar, sem
# depender de a thread do subsistema input rodar.
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# O LVGL é posto de pé pelo teste, depois de o display inicializar, e o
# laço é o próprio teste quem roda, com lv_timer_handler() e lv_indev_read().
CONFIG_LVGL=y
CONFIG_LV_Z_AUTO_INIT=n
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_MONOCHROME_CONVERSION_BUFFER=y
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_MEM_POOL_SIZE=24576
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y
