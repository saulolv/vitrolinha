CONFIG_ZTEST=y
CONFIG_ASSERT=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=20000
CONFIG_VITROLINHA_STORAGE_HOST=y
# O player de verdade, que é quem publica o instantâneo que os LEDs leem.
CONFIG_POLL=y
CONFIG_VITROLINHA_AUTO_ADVANCE=n

# A fita é a de mentira do app.overlay, no alias led-strip: com ela o
# Kconfig.vitrolinha liga o módulo sozinho, como faz na placa.
CONFIG_LED_STRIP=y
