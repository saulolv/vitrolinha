CONFIG_ZTEST=y
CONFIG_ASSERT=y
CONFIG_LOG=y
CONFIG_VITROLINHA_STORAGE_HOST=y

# O mesmo settings do firmware: NVS na storage_partition da flash simulada,
# que o native_sim guarda num arquivo. Reinicializar o módulo e reler a
# flash é o reinício da placa.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_VITROLINHA_LAST_TRACK=y

# settings_runtime_set entrega registros malformados ao tratador, sem
# precisar gravá-los na flash.
CONFIG_SETTINGS_RUNTIME=y
