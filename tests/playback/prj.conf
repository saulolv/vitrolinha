CONFIG_ZTEST=y
CONFIG_ASSERT=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=20000
CONFIG_VITROLINHA_STORAGE_HOST=y
# O player espera comando e resultado de carga num mesmo k_poll.
CONFIG_POLL=y
# Estes casos tocam cada faixa até o fim e conferem a parada em 100%: o
# avanço automático tem suíte própria, em tests/auto_advance/.
CONFIG_VITROLINHA_AUTO_ADVANCE=n
