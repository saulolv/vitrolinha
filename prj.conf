# Configuração comum aos dois alvos de compilação.
#
# O que é específico de cada um mora em boards/: a ZBook P2 em
# boards/zbook_rp2350b_m33_p2.conf, o simulador em boards/native_sim.conf.
# Aqui fica o que vale para os dois — a interface gráfica, a temporização e
# o diagnóstico, que são justamente as partes que se quer poder exercitar
# sem a placa.
#
# Uma opção deste arquivo quebra o projeto EM SILÊNCIO se omitida; está
# marcada com "SILENCIOSO" no comentário.

# ----------------------------------------------------------------------------
# Entrada e saída comuns
# ----------------------------------------------------------------------------
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

CONFIG_DISPLAY=y

# ----------------------------------------------------------------------------
# Cartão e sistema de arquivos
# ----------------------------------------------------------------------------

# A pilha de disco vem do defconfig da ZBook, mas não do simulador. Declarada
# aqui porque o módulo `card` monta o mesmo volume "SD" nos dois alvos, com o
# mesmo código — o que difere é de onde o disco aparece, e isso está em
# boards/.
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# SILENCIOSO E DESTRUTIVO: o padrão do Zephyr é `y`. Com ele ligado, um cartão
# que não monta é FORMATADO pelo próprio `fs_mount` — "Note: This option is
# destructive to data and will automatically destroy your disk, if mount
# attempt fails", diz o texto de ajuda da própria opção. Um cartão com a
# partição levemente danificada entraria na placa com a biblioteca do usuário
# e sairia vazio, sem erro nenhum.
#
# A aplicação nunca formata cartão: a biblioteca é do usuário. O módulo `card`
# ainda passa FS_MOUNT_FLAG_NO_FORMAT na montagem, para que religar esta opção
# por engano não rearme a bomba.
CONFIG_FS_FATFS_MOUNT_MKFS=n

# O padrão de 4 é pré-alocado estaticamente. Só o `storage` toca no sistema
# de arquivos, e nunca em mais de um arquivo por vez.
CONFIG_FS_FATFS_NUM_FILES=2
CONFIG_FS_FATFS_NUM_DIRS=2

# CONFIG_FS_FATFS_LFN fica desligado de propósito: o nome exibido vem do
# cabeçalho RTTTL, não do nome de arquivo, então nomes longos custariam RAM
# estática sem contrapartida. Isso também dispensa decidir entre LFN_MODE_BSS
# e reentrância — e sem reentrância o FF_FS_TIMEOUT do FatFs deixa de ser
# K_FOREVER.

# ----------------------------------------------------------------------------
# Temporização
# ----------------------------------------------------------------------------

# 50 us de quantização, de graça sob tickless. Não subir para 100 kHz: nesse
# ponto o ciclo por tick iguala o atraso mínimo do SysTick e o driver pode
# expirar em dobro.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=20000

# ----------------------------------------------------------------------------
# Interface gráfica
# ----------------------------------------------------------------------------
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_1=y

# SILENCIOSO: sem o buffer de conversão, o caminho monocromático não é
# registrado e a inicialização do display devolve -ENOTSUP.
CONFIG_LV_Z_MONOCHROME_CONVERSION_BUFFER=y

CONFIG_LV_Z_COLOR_MONO_HW_INVERSION=y

# Quadro inteiro: 128x64 a 1 bpp são 1024 B, ~2 KB com o buffer de conversão.
# Renderização parcial seria economia sem propósito nesse tamanho.
CONFIG_LV_Z_VDB_SIZE=100

# O padrão de 2048 B não sustenta uma lista de 32 itens: no LVGL 9 cada item
# é um botão mais um rótulo, ~150-200 B de heap cada. Dimensionar por medição
# com `lvgl stats memory`, não por estimativa.
CONFIG_LV_Z_MEM_POOL_SIZE=24576

# O laço do LVGL roda numa fila de trabalho dedicada, em vez de num laço que
# a aplicação escreveria. Precisa estar ligado explicitamente: o padrão é n, e
# a prioridade abaixo só existe dentro deste `if`.
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=y

# SILENCIOSO: o padrão é 0, a maior prioridade preemptível. Deixado assim, o
# laço do LVGL sobrepuja qualquer thread do player — o inverso exato da
# arquitetura pretendida, sem erro nenhum. É a configuração que, omitida,
# invalida a tese do trabalho.
CONFIG_LV_Z_LVGL_WORKQUEUE_PRIORITY=10

# Grade exata de 16 colunas por 8 linhas na tela de 128x64.
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y

# `lvgl stats memory`, para dimensionar o pool acima por medição. Depende de
# CONFIG_SHELL, que não vem do defconfig da placa.
CONFIG_SHELL=y
CONFIG_LV_Z_SHELL=y

# ----------------------------------------------------------------------------
# Diagnóstico e robustez
# ----------------------------------------------------------------------------

# Vem do defconfig da ZBook, mas não do simulador: sem declarar aqui, todo
# LOG_* compila para nada no alvo simulado e o firmware fica mudo sem
# nenhum aviso.
CONFIG_LOG=y

# Log diferido: em modo imediato a formatação acontece na thread que chamou
# LOG_*, o que poria trabalho de E/S serial dentro de caminhos que precisam
# ser curtos. Diferido é o padrão do Zephyr, declarado aqui porque o projeto
# depende disso e não de um padrão.
CONFIG_LOG_MODE_DEFERRED=y

# Nomes nas threads, senão o relatório do analisador vira uma lista de
# endereços.
CONFIG_THREAD_NAME=y

# Violação de pré-condição de API do kernel para de passar batida. Custa
# tamanho de código; sai quando o firmware for para demonstração final.
CONFIG_ASSERT=y
